<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>URL変換ツール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #ffffff;
      color: #222222;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ヘッダー */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .header img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      text-align: left;
    }

    /* 切り替えボタン */
    .mode-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-buttons button {
      flex: 1;
      padding: 14px 10px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      background: #f5f5f5;
      font-size: 16px;
      cursor: pointer;
    }

    .mode-buttons button.active {
      background: #333333;
      color: #ffffff;
    }

    /* 入力エリア */
    .tool-panel {
      width: 100%;
    }

    .tool-panel p {
      margin: 0 0 8px;
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    /* 変換ボタン */
    .convert-button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #333333;
      color: #ffffff;
      cursor: pointer;
    }

    /* 結果 */
    #output {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 6px;
      word-break: break-all;
    }

    /* 下ボタン */
    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .button-row button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .header h1 {
        font-size: 24px;
      }

      .mode-buttons button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ヘッダー -->
    <div class="header">

      <img src="トータルロゴ.png" alt="Logo">

      <h1>URL変換ツール</h1>

    </div>


    <!-- モード切り替え -->
    <div class="mode-buttons">

      <button
        id="driveButton"
        class="active"
        onclick="switchMode('drive')"
      >
        Google Drive
      </button>

      <button
        id="slideButton"
        onclick="switchMode('slide')"
      >
        Google スライド
      </button>

      <button
        id="dropboxButton"
        onclick="switchMode('dropbox')"
      >
        Dropbox
      </button>

      <button
        id="appendButton"
        onclick="switchMode('append')"
      >
        URL末尾追加
      </button>

    </div>


    <!-- 入力エリア -->
    <div class="tool-panel">

      <p>共有URLを入力してください：</p>

      <input
        type="text"
        id="mainInput"
        placeholder="URLを入力してください"
      >

      <p>追加する文字列：</p>

      <input
        type="text"
        id="appendText"
        placeholder="追加する文字列を入力してください"
      >

      <button
        class="convert-button"
        onclick="convertCurrentMode()"
      >
        変換する
      </button>

    </div>


    <!-- 結果 -->
    <div id="output"></div>


    <!-- コピー・クリア -->
    <div class="button-row">

      <button onclick="copyUrl()">
        コピー
      </button>

      <button onclick="clearAll()">
        クリア
      </button>

    </div>

  </div>


  <script>

    /* ========================================
       現在のモード
       ======================================== */

    let currentMode = "drive";


    /* ========================================
       モード切り替え
       ======================================== */

    function switchMode(mode) {

      currentMode = mode;

      document
        .getElementById("driveButton")
        .classList.remove("active");

      document
        .getElementById("slideButton")
        .classList.remove("active");

      document
        .getElementById("dropboxButton")
        .classList.remove("active");

      document
        .getElementById("appendButton")
        .classList.remove("active");

      document
        .getElementById(mode + "Button")
        .classList.add("active");

      document
        .getElementById("output")
        .innerText = "";
    }


    /* ========================================
       現在のモードで変換
       ======================================== */

    function convertCurrentMode() {

      if (currentMode === "drive") {

        convertDrive();

        return;
      }

      if (currentMode === "slide") {

        convertSlide();

        return;
      }

      if (currentMode === "dropbox") {

        convertDropbox();

        return;
      }

      if (currentMode === "append") {

        convertAppend();

        return;
      }
    }


    /* ========================================
       Google Drive
       
       入力：
       https://drive.google.com/file/d/ID/view
       
       出力：
       https://drive.google.com/uc?export=download&id=ID
       ======================================== */

    function convertDrive() {

      const input =
        document
          .getElementById("mainInput")
          .value
          .trim();

      const output =
        document.getElementById("output");


      if (!input) {

        output.innerText =
          "URLを入力してください。";

        return;
      }


      const match =
        input.match(
          /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/
        );


      if (!match) {

        output.innerText =
          "正しいGoogle Drive URLではありません。";

        return;
      }


      const fileId =
        match[1];


      const result =
        `https://drive.google.com/uc?export=download&id=${fileId}`;


      output.innerText =
        result;
    }


    /* ========================================
       Google スライド
       
       入力：
       https://docs.google.com/presentation/d/ID/edit
       
       または
       
       https://docs.google.com/presentation/d/ID/edit?slide=id.xxx
       
       出力：
       https://docs.google.com/presentation/d/ID/export/pdf
       ======================================== */

    function convertSlide() {

      const input =
        document
          .getElementById("mainInput")
          .value
          .trim();

      const output =
        document.getElementById("output");


      if (!input) {

        output.innerText =
          "URLを入力してください。";

        return;
      }


      const match =
        input.match(
          /docs\.google\.com\/presentation\/d\/([a-zA-Z0-9_-]+)/
        );


      if (!match) {

        output.innerText =
          "❌ 正しいGoogleスライドURLではありません。";

        return;
      }


      const presentationId =
        match[1];


      /*
       * 編集URLの /edit や
       * ?slide=id.xxx は使わない。
       *
       * プレゼンテーションIDだけを使って
       * PDFダウンロードURLを作る。
       */

      const result =
        `https://docs.google.com/presentation/d/${presentationId}/export/pdf`;


      output.innerText =
        result;
    }


    /* ========================================
       Dropbox
       ======================================== */

    function convertDropbox() {

      document
        .getElementById("output")
        .innerText =
        "Dropbox機能はまだ実装されていません。";
    }


    /* ========================================
       URL末尾追加
       ======================================== */

    function convertAppend() {

      const input =
        document
          .getElementById("mainInput")
          .value
          .trim();

      const addition =
        document
          .getElementById("appendText")
          .value;


      if (!input) {

        document
          .getElementById("output")
          .innerText =
          "URLを入力してください。";

        return;
      }


      if (!addition) {

        document
          .getElementById("output")
          .innerText =
          "追加する文字列を入力してください。";

        return;
      }


      document
        .getElementById("output")
        .innerText =
        input + addition;
    }


    /* ========================================
       コピー
       ======================================== */

    function copyUrl() {

      const text =
        document
          .getElementById("output")
          .innerText
          .trim();


      if (!text) {

        alert("コピーするURLがありません。");

        return;
      }


      navigator.clipboard
        .writeText(text)
        .then(function() {

          alert("コピーしました！");

        })
        .catch(function() {

          alert("コピーできませんでした。");

        });
    }


    /* ========================================
       クリア
       ======================================== */

    function clearAll() {

      document
        .getElementById("mainInput")
        .value = "";

      document
        .getElementById("appendText")
        .value = "";

      document
        .getElementById("output")
        .innerText = "";
    }

  </script>

</body>
</html>
