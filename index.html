<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>URL変換ツール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #ffffff;
      color: #222222;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ヘッダー */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .header img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      text-align: left;
    }

    /* 切り替えボタン */
    .mode-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-buttons button {
      flex: 1;
      padding: 14px 10px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      background: #f5f5f5;
      font-size: 16px;
      cursor: pointer;
    }

    .mode-buttons button.active {
      background: #333333;
      color: #ffffff;
    }

    /* 入力エリア */
    .tool-panel {
      width: 100%;
    }

    .tool-panel p {
      margin: 0 0 8px;
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    /* 変換ボタン */
    .convert-button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #333333;
      color: #ffffff;
      cursor: pointer;
    }

    /* 結果 */
    #output {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 6px;
      word-break: break-all;
    }

    /* 下ボタン */
    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .button-row button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }

    /* まだ使わないパネル */
    .hidden {
      display: none;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      h1 {
        font-size: 24px;
      }

      .mode-buttons button {
        font-size: 14px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ヘッダー -->
    <div class="header">

      <img src="トータルロゴ.png" alt="Logo">

      <h1>URL変換ツール</h1>

    </div>

    <!-- 切り替え -->
    <div class="mode-buttons">

      <button
        id="driveButton"
        class="active"
        onclick="switchMode('drive')"
      >
        Google Drive
      </button>

      <button
        id="slideButton"
        onclick="switchMode('slide')"
      >
        Google スライド
      </button>

      <button
        id="dropboxButton"
        onclick="switchMode('dropbox')"
      >
        Dropbox
      </button>

      <button
        id="appendButton"
        onclick="switchMode('append')"
      >
        URL末尾追加
      </button>

    </div>

    <!-- 入力エリア -->
    <div class="tool-panel">

      <p id="inputLabel">共有URLを入力してください：</p>

      <input
        type="text"
        id="driveInput"
        placeholder="Google Driveの共有URL"
      >

      <div id="appendArea" class="hidden">

        <p>追加する文字列：</p>

        <input
          type="text"
          id="appendText"
          placeholder="?download=1"
        >

      </div>

      <button
        class="convert-button"
        id="convertButton"
        onclick="convertDrive()"
      >
        変換する
      </button>

    </div>

    <!-- 結果 -->
    <div id="output"></div>

        <!-- ボタン -->
        <div class="button-row">

          <button onclick="copyUrl()">
            コピー
          </button>

          <button onclick="clearAll()">
            クリア
          </button>

        </div>

      </div>
  

       <script>

         let currentMode = "drive";

         function switchMode(mode) {

           currentMode = mode;

           document.getElementById("driveButton").classList.remove("active");
           document.getElementById("slideButton").classList.remove("active");
           document.getElementById("dropboxButton").classList.remove("active");
           document.getElementById("appendButton").classList.remove("active");

           document.getElementById(mode + "Button").classList.add("active");

         }

         function copyUrl() {

           const text =
             document.getElementById("output").innerText;

           if (!text) {
             alert("コピーするURLがありません。");
             return;
           }

           navigator.clipboard.writeText(text);

         }

         function clearAll() {

           document.getElementById("driveInput").value = "";
           document.getElementById("appendText").value = "";
           document.getElementById("output").innerText = "";

         }


      </script>

    </body>
    </html>
